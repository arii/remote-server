# mypy rollout config (issue #1176). NOT a CI gate: the tree is not
# fully annotated yet. Budgets (2026-11-08, mypy 2.4.1):
#   mypy backend/api/routers/chat.py -> 7 errors in 3 files
#     backend/proposals.py: 3 (arg-type x2, return-value)
#     backend/core/git_helpers.py: 1 (var-annotated)
#     backend/api/routers/chat.py: 3 (dict-item: `Any | None` unpacks)
#   mypy backend deep-agent -> 55 errors in 21 files (117 checked)
# Reproduce with `npm run typecheck:python` (needs mypy on PATH:
# pip install "mypy==2.4.1").
#
# Rollout ladder: annotate a module, verify it is green under strict
# flags, add an active per-module section for it below, and watch the
# budgets above shrink. No module is strict-clean yet (even small
# ones fail disallow-untyped-defs), so there are no active per-module
# sections — the first graduation adds one here, e.g.:
#   [mypy-backend.validate_config]
#   disallow_untyped_defs = True
#   disallow_incomplete_defs = True
# Only when the budget hits zero does this become a CI gate.
[mypy]
python_version = 3.11
ignore_missing_imports = True
show_error_codes = True
