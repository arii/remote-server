# remote-server — TRIGKEY S5 home server
#
# Public ingress (Ari's EXISTING dynamic DDNS + certbot, no new certs/DNS):
#   https://${TERMINAL_DOMAIN}:${TERMINAL_PORT}
#     -> oauth2-proxy (terminates TLS with the existing LE certs,
#        GitHub OAuth gate, single-user allowlist)
#     -> caddy (internal router: / -> terminal, /buttons -> buttons, /code -> code-server)
#     -> terminal (ttyd + zellij, session persists across reconnects)
#     -> buttons (allowlisted action runner, see docs/buttons.md)
#     -> code-server (browser VS Code, see docs/remote-access.md)
#
# Tailscale = VPN mesh for admin access to everything else (SSH, future
# services). The terminal does NOT require Tailscale.
#
# Pi + Ollama are ACTIVE (2026-10-27, see docs/pi-setup.md).
# openclaw / actions-runner stay ON HOLD — decision deferred 2026-10-22.
# See the commented profiles block at the bottom.
#
# All secrets via environment (.env, never committed). See README.md + docs/.

name: remote

# Shared log rotation: every service keeps 3x10MB of json-file logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # TLS edge + GitHub OAuth gate. Terminates TLS itself with Ari's existing
  # Let's Encrypt certs (mounted read-only from the host certbot dir).
  oauth2-proxy:
    # Pinned to v7.15.2, not the old v7.9.0: CVE-2026-41059 lets
    # 7.5.0-7.15.1 with --reverse-proxy + skip-auth rules be bypassed
    # via a spoofed X-Forwarded-Uri header, and the webhook below
    # needs a skip-auth rule. Verify the tag pulls at deploy.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
    command:
      - --config=/etc/oauth2-proxy.cfg
      - --http-address= # disable the plain-HTTP listener entirely
      - --https-address=0.0.0.0:${TERMINAL_PORT}
      # Webhook ingress: GitHub cannot pass the OAuth gate, so this
      # ONE exact route (POST only, full path, no wildcards) skips
      # auth. The buttons handler still verifies the HMAC signature,
      # so a skip-auth bypass alone cannot trigger a pull.
      - --skip-auth-route=POST=^/buttons/api/webhook$
      # PWA manifest + icons are public, non-sensitive install assets.
      # Browsers fetch the manifest without credentials by default, so
      # gating it behind OAuth 302s to GitHub and fails CORS on every
      # load (#943). GET-only, exact manifest + icons prefix only; the
      # app shell and every /api route stay behind the OAuth gate.
      - --skip-auth-route=GET=^/buttons/manifest\.json$
      - --skip-auth-route=GET=^/buttons/icons/.+$
      - --tls-cert-file=/certs/live/${TERMINAL_DOMAIN}/fullchain.pem
      - --tls-key-file=/certs/live/${TERMINAL_DOMAIN}/privkey.pem
      - --upstream=http://caddy:8080
    user: "0:0" # must read the LE privkey (root-owned); the key never leaves the host
    volumes:
      - ./config/oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
      # Whole certbot dir (not individual files): live/ holds symlinks that
      # certbot re-points on every renewal — file mounts would go stale.
      - ${LE_DIR:-/etc/letsencrypt}:/certs:ro
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_GITHUB_USER: ${GITHUB_USER:?GITHUB_USER must be set to your GitHub username (see .env.example)}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
    ports:
      - "${TERMINAL_PORT}:${TERMINAL_PORT}" # public: DDNS + router forward land here
    depends_on:
      caddy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    logging: *default-logging
    restart: unless-stopped

  # Browser terminal: ttyd (xterm.js) running zellij (phone-friendly multiplexer).
  # Closing the browser tab "detaches"; reopening re-attaches to the live session.
  terminal:
    build:
      context: ./terminal
      args:
        TTYD_VERSION: ${TTYD_VERSION:-1.7.7}
        ZELLIJ_VERSION: ${ZELLIJ_VERSION:-0.45.1}
    image: ${TERMINAL_IMAGE:-ghcr.io/arii/remote-server-terminal:latest} # default: CI-built GHCR image (public, no login needed to pull); override in .env to pin a tag or build locally
    entrypoint: ["ttyd"]
    command:
      - --port=7681
      - --interface=0.0.0.0
      - --writable # ttyd >= 1.7.5 is READ-ONLY by default; without this the shell is view-only
      - --max-clients=1 # single active browser connection at a time; takeover via button
      - -I
      - /etc/ttyd/index.html
      - --ping-interval=30 # keep the websocket alive on flaky mobile networks
      - -t
      - fontSize=15
      - zellij
      - attach
      - --create
      - main
    volumes:
      - .:/srv/remote-server # repo (compose, docs, .env) editable from the phone
      # Docker socket: manage this stack from the phone (docker compose ps/up/...).
      # This is root-equivalent — the GitHub OAuth single-user gate is the boundary.
      - /var/run/docker.sock:/var/run/docker.sock
      # System gitconfig (safe.directory = * + user identity) so bind-mounted
      # checkouts work out of the box across container recreates.
      - ./terminal/gitconfig:/etc/gitconfig:ro
      # Pi sessions + auth persist in pi-data; tracked config files are
      # bind-mounted directly so updates in git apply on container recreate
      # without manual docker cp or losing session history.
      - pi-data:/root/.pi
      - ./terminal/pi-config/models.json:/root/.pi/agent/models.json
      - ./terminal/pi-config/mcp.json:/root/.pi/agent/mcp.json
      - ./terminal/pi-config/APPEND_SYSTEM.md:/root/.pi/agent/APPEND_SYSTEM.md
      - ./terminal/pi-config/AGENTS.md:/root/.pi/agent/AGENTS.md
      - ./terminal/pi-config/skills:/root/.pi/agent/skills
      # Persist Antigravity CLI (agy) binary, state, auth, and chat history across container recreates.
      - gemini-data:/root/.gemini
      - local-data:/root/.local
      # Muse CLI auth/settings persist across recreates (the binary is
      # baked into the image; /root/.local already persists via local-data).
      - muse-data:/root/.config/muse
      # gh CLI login (hosts.yml) persists across recreates so MCP
      # servers and agents find authenticated gh on every boot.
      - gh-data:/root/.config/gh
      # Other checkouts, cloned on the host (see docs/pi-setup.md § repos).
      # HOST_HOME defaults to /home/ari (host user path).
      - ${HOST_HOME:-/home/ari}/repos:/srv/repos
      # Host SSH key, read-only: lets Pi (and git inside the container) push
      # over SSH as you. Requires github.com in the host ~/.ssh/known_hosts
      # (see the doc) — a read-only mount cannot add it on first connect.
      - ${HOST_HOME:-/home/ari}/.ssh:/root/.ssh:ro
      # Shared co-browse pause-state (#1104): buttons writes
      # AGENT_CONTROL_STATE_FILE here; pipeline.py reads it. RW —
      # resumption clears requires_dom_refresh in place.
      - buttons-data:/var/lib/buttons
    environment:
      TERM: xterm-256color
      PATH: /root/.local/bin:/opt/venvs/td/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Durability: shell history and caches (zellij sessions, pip) live on
      # the local-data volume instead of the ephemeral container layer.
      HISTFILE: /root/.local/share/bash_history
      XDG_CACHE_HOME: /root/.local/cache
      # Fine-grained GitHub PAT (repo scope) + GitHub App credentials from .env,
      # for boomtick-mcp, td, and gh. Empty/unset = public read-only GitHub ops only.
      GITHUB_TOKEN: ${BOOMTICK_GITHUB_TOKEN:-}
      GH_TOKEN: ${BOOMTICK_GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      APP_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-}
      NEBIUS_SPEND_CAP_USD: ${NEBIUS_SPEND_CAP_USD:-}
      # Shared headed browser (Solution A): Selenium Grid base for agent
      # CDP sessions. The service must exist; there is no fail-safe.
      BROWSER_ENDPOINT: http://browser:4444
      # Same pause-state file as buttons (#1104); /tmp is per-container
      # and would split-brain the pause across the takeover boundary.
      AGENT_CONTROL_STATE_FILE: /var/lib/buttons/agent_control_state.json
    expose:
      - "7681" # compose network only; the only ingress is via oauth2-proxy
    depends_on:
      ollama:
        condition: service_healthy
      skills-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7681/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 6G
        reservations:
          memory: 512M
    logging: *default-logging
    restart: unless-stopped

  # One-shot: install .agents/skills from skills-lock.json on every
  # bring-up. Idempotent (no-op when satisfied) and fail-open, so a fresh
  # reinstall provisions skills automatically without blocking the stack.
  skills-provisioner:
    image: ${TERMINAL_IMAGE:-ghcr.io/arii/remote-server-terminal:latest}
    volumes:
      - .:/srv/remote-server
    command: ["bash", "/srv/remote-server/scripts/provision-skills.sh", "--fail-open"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    logging: *default-logging

  # Local LLM inference, CPU-only. Loopback-published only.
  # Active since 2026-10-27 for Pi (see docs/pi-setup.md).
  ollama:
    # Pinned 2026-11-04 (#478): digest of ollama 0.40.12, the version
    # running in prod at pin time (was :latest) — byte-identical, no upgrade.
    # Upgrade: run the candidate, smoke `ollama list` + one chat completion,
    # then bump tag+digest together and note old/new versions in the PR.
    image: ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Box has 32GB RAM (26.8GB usable); a 14b model needs ~10GB.
    # 14G limit + 8 CPU cap keeps local inference from starving the desktop/stack.
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 14G
        reservations:
          memory: 6G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s # model load into RAM takes a while on CPU
    logging: *default-logging
    restart: unless-stopped

  # VPN mesh for admin access (SSH, future services). Outbound only.
  # Terminal access does NOT go through Tailscale — it uses the public DDNS URL.
  tailscale:
    # Pinned 2026-11-04 (#478): digest of tailscale v1.104.2, the version
    # running in prod at pin time (was :stable) — byte-identical, no upgrade.
    # Upgrade: run the candidate, smoke `tailscale status` on the box,
    # then bump tag+digest together and note old/new versions in the PR.
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./scripts/tailscale-entrypoint.sh:/usr/local/bin/tailscale-entrypoint.sh:ro
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY} # reusable auth key from Tailscale admin console
      TS_HOSTNAME: ${TS_HOSTNAME:-s5}
    entrypoint: ["/usr/local/bin/tailscale-entrypoint.sh"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging: *default-logging
    restart: unless-stopped

  # Phone UI: FastAPI backend + Vite SPA in one image (see root
  # Dockerfile). No free-text input anywhere. Built locally on the S5
  # (no GHCR image).
  # The checkout mount MUST use the host-identical path
  # (/home/ari/remote-server): this container runs docker compose
  # against the host daemon, and compose resolves relative paths
  # against the project directory as seen by the CLI.
  buttons:
    build:
      context: .
      dockerfile: Dockerfile
    image: remote-buttons:local
    # Locally built only: bare `docker compose pull` would otherwise try
    # Docker Hub for remote-buttons:local and warn/fail. This skips it
    # from pull; build it with `docker compose up -d --build buttons`.
    pull_policy: build
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_HOME:-/home/ari}/remote-server:/home/ari/remote-server
      # Host-identical repos mount, same trick as above: the webhook
      # auto-pull needs the tech-dancer checkout at the same path
      # inside this container as on the host.
      - ${HOST_HOME:-/home/ari}/repos:/home/ari/repos
      # Host SSH key, read-only: Deploy runs `git pull` over SSH as
      # root inside this container, and git needs both the key and
      # github.com in known_hosts. Mirrors the terminal container.
      # No trust expansion: the socket already gives this container
      # root-equivalent host access.
      - ${HOST_HOME:-/home/ari}/.ssh:/root/.ssh:ro
      # Ledger volume: the audit log lives here, never in a
      # checkout, so pulls and rebuilds cannot dirty or erase it.
      - buttons-data:/var/lib/buttons
    environment:
      HOME: /home/ari # ${HOME} in the compose file must interpolate to host paths
      # GitHub webhook HMAC secret (see .env.example). Empty/unset =
      # webhook endpoint refuses everything (fail closed).
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      BUTTONS_PUBLIC_URL: ${BUTTONS_PUBLIC_URL:-}
      DIGEST_INTERVAL_HOURS: ${DIGEST_INTERVAL_HOURS:-12}
      NOTIFY_EVENTS: ${NOTIFY_EVENTS:-ci_fail,conflict}
      NOTIFIER_INTERVAL_SECONDS: ${NOTIFIER_INTERVAL_SECONDS:-300}
      # GitHub identity for gh/td inside the console backend (mirrors
      # terminal). Empty/unset = public read-only GitHub ops only.
      GITHUB_TOKEN: ${BOOMTICK_GITHUB_TOKEN:-}
      GH_TOKEN: ${BOOMTICK_GITHUB_TOKEN:-}
      # Nebius fallback for the local-model router (mirrors terminal).
      # Empty/unset = Ollama-only; calls raise instead of falling back.
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-}
      # Metered-spend cap (gate + budget UI). Empty/unset = uncapped.
      NEBIUS_SPEND_CAP_USD: ${NEBIUS_SPEND_CAP_USD:-}
      # Ollama on the compose network (repair worker, narrators).
      # localhost is this container itself — the reachable default is
      # the ollama service alias (issue #966). Host override wins.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/api/generate}
      # Shared pause-state with the terminal pipeline (#1104): the
      # agent_control file lives on the buttons-data volume (already
      # mounted at /var/lib/buttons below); terminal mounts the same
      # volume so takeover pauses pipeline runs across containers.
      # /tmp is per-container and would split-brain the pause.
      AGENT_CONTROL_STATE_FILE: /var/lib/buttons/agent_control_state.json
    expose:
      - "8000" # compose network only; ingress is via oauth2-proxy -> caddy
    # init reaps the entrypoint's background index build (#699).
    init: true
    healthcheck:
      # Plain python stdlib (image has no curl/wget): 200 on /health.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Boot is fast: the RAG index builds in the background (#699)
      # while uvicorn already serves; /health reports its state.
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 256M
    logging: *default-logging
    restart: unless-stopped
    # In-flight SSE chat streams run minutes on CPU-Ollama; uvicorn drains
    # them on SIGTERM but Docker SIGKILLs after 10s by default, which
    # truncates every live stream on each buttons recreate (caddy logs
    # upstream EOF, browser shows network error). 5m lets real streams
    # finish; the cap never delays an idle stop.
    stop_grace_period: 5m

  # Internal router: oauth2-proxy -> caddy -> terminal (/) / buttons (/buttons) / code-server (/code).
  caddy:
    image: caddy:2-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      # Directory mount (not the single file): git replaces files by rename
      # on pull, which would leave a file bind pointing at the deleted old
      # inode (caddy would keep serving the previous config until recreated).
      - ./caddy:/etc/caddy:ro
    expose:
      - "8080" # compose network only; ingress is via oauth2-proxy
    # Admin-API liveness (not :8080, which also depends on the backends).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2019/config/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      terminal:
        condition: service_healthy
      buttons:
        condition: service_healthy
      code-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    logging: *default-logging
    restart: unless-stopped

  # BrowserMCP pairing relay: the daemon's relay is loopback-only inside
  # terminal's network namespace, so this shares that namespace (no terminal
  # recreate needed) and forwards the laptop to the daemon. Listens on 19010
  # (not 9010) because the daemon already holds 127.0.0.1:9010 here. Path:
  # laptop extension -> localhost:9010 -> ssh -L -> host -> terminal:19010
  # -> daemon 127.0.0.1:9010. No published ports (forbidden with this
  # network mode); the host reaches terminal:19010 over the compose network.
  # See docs/browser-mcp-pairing.md.
  browser-relay:
    image: caddy:2-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    network_mode: service:terminal
    volumes:
      - ./config/browser-relay:/etc/caddy:ro
    depends_on:
      - terminal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    logging: *default-logging
    restart: unless-stopped

  # Shared headed browser for visual co-browsing (Solution A): real
  # Chromium on Xvfb. Humans watch/drive via the noVNC stream (:7900,
  # routed at /browser*); agents drive it over CDP (:4444). Replaces
  # the decommissioned browserless head.
  browser:
    # Pinned 2026-11-06: digest of selenium/standalone-chromium at
    # Solution-A bring-up (was :latest) — byte-identical, no upgrade.
    image: selenium/standalone-chromium@sha256:b211549a4c35f11826bc1a7559b9f23ff055198517f8cb7d49ef74df01c5e38d
    container_name: remote-browser-1
    # Stable hostname: Chromium's Singleton profile lock embeds it, so
    # a changing hostname (default: container id) makes every recreate
    # look like "another computer" and refuse the shared profile.
    hostname: shared-browser
    shm_size: "2gb"
    # Reap zombie Chromium renderer/GPU subprocesses on teardown:
    # without an init, orphaned procs accumulate until the container
    # hits its PID/memory limit and crashes.
    init: true
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          memory: 512M
    restart: unless-stopped
    expose:
      - "4444"
    ports:
      - "127.0.0.1:4444:4444"
    volumes:
      # Persistent Chromium agent profile on the host drive: logins,
      # cookies, localStorage survive container restarts. Pre-created
      # as 1200:1201 (seluser) so the node can write. The human side
      # no longer needs noVNC or a personal window: the /cdp-stream
      # viewer attaches to the live agent session (or opens its own).
      - ${HOST_HOME:-/home/ari}/.s5-shared-browser:/data/shared-browser
    environment:
      - SE_START_XVFB=true
      - SE_NODE_MAX_SESSIONS=1
      - SE_VNC_NO_PASSWORD=true
      - VNC_NO_PASSWORD=1
      # The profile lives on the mounted host dir; the path is
      # passed per-session via goog:chromeOptions (ChromeDriver yields
      # to a user-supplied --user-data-dir, unlike the image wrapper
      # flag which its temp dir overrides). Single session => no lock
      # contention.
      # Idle reap (issue #1054): 10 minutes, not an hour. A leaked
      # session wedged the single slot ~1hr; agent runs issue
      # commands continuously so only truly idle sessions die, and
      # the viewer transparently creates a new one on next connect
      # (browser_view refcounted shared session). Watched-idle heads
      # still survive 10x longer than the 300s Grid default.
      - SE_NODE_SESSION_TIMEOUT=600
    logging: *default-logging

  # Browser-based VS Code: code-server.
  # --auth none: the GitHub OAuth gate is the boundary, same as ttyd.
  # Mounts repos checkouts, stack checkout, and persistent config/extensions volumes.
  code-server:
    # Pinned 2026-11-04 (#478): digest of code-server 4.144.0, the version
    # running in prod at pin time (was :latest) — byte-identical, no upgrade.
    # Upgrade: run the candidate, smoke opening /code in a browser,
    # then bump tag+digest together and note old/new versions in the PR.
    image: codercom/code-server:4.144.0@sha256:b9e8056bb74bd0c4f90284c7559eddeccd38400cfedc28e64c9d3ca50fef1f83
    command:
      - --auth
      - none
      - --bind-addr
      - 0.0.0.0:8080
      - /srv/repos
    volumes:
      - ${HOST_HOME:-/home/ari}/repos:/srv/repos
      - .:/srv/remote-server
      # Persistent settings and extensions across container recreates:
      - code-server-data:/home/coder/.local/share/code-server
      - code-server-config:/home/coder/.config/code-server
      # Continue extension configuration pre-pointed to local Ollama (qwen3:8b):
      - ./config/continue:/home/coder/.continue:ro
      # Boot hooks (ENTRYPOINTD): install-extensions.sh converges the
      # declarative set in extensions.txt on every start. Directory mount
      # so list edits apply on the next recreate without stale inodes.
      - ./config/code-server/entrypoint.d:/seed/entrypoint.d:ro
    environment:
      ENTRYPOINTD: /seed/entrypoint.d
    expose:
      - "8080" # compose network only; ingress is via oauth2-proxy -> caddy (/code)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s # extension installs run on fresh volumes
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          memory: 512M
    logging: *default-logging
    restart: unless-stopped

volumes:
  tailscale-state:
  ollama-data:
  pi-data:
  gemini-data:
  local-data:
  muse-data:
  gh-data:
  buttons-data:
  code-server-data:
  code-server-config:

# ---------------------------------------------------------------------------
