<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Browser viewer</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
*:focus-visible{outline:2px solid #0a84ff;outline-offset:1px}
#bar{display:flex;gap:8px;padding:8px;align-items:center;flex-wrap:wrap}
#nav{display:flex;gap:8px;flex:1;min-width:0}
#url{flex:1;min-width:0;padding:6px;font-size:16px;min-height:44px;box-sizing:border-box;background:#1c1c1e;color:#fff;border:1px solid #000;border-radius:8px}
#go,#kb{min-height:44px;background:#3a3a3c;color:#fff;border:1px solid #000;border-radius:8px;padding:6px 12px}
#state{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stats{padding:0 8px 8px;font-size:14px;color:#9f9;font-variant-numeric:tabular-nums}
#screen{display:block;max-width:100vw;height:auto;border-top:1px solid #333;cursor:default;touch-action:none}
/* Floating keyboard shell (research: Kasm FAB + draggable panel,
Guacamole summon-on-demand; never docked in-flow — a docked board
reflows the canvas and hides what you are typing into). */
#kbd{position:fixed;left:8px;right:8px;bottom:8px;z-index:50;max-width:none;max-height:48vh;overflow-y:auto;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.6);padding:0 6px calc(6px + env(safe-area-inset-bottom))}
#kbd[hidden]{display:none}
#kbd-handle{display:flex;align-items:center;gap:8px;padding:8px 4px 4px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:#9a9aa0;font-size:13px}
#kbd-handle:active{cursor:grabbing}
#kbd-grip{letter-spacing:2px}
#kbd-title{flex:1;text-align:center}
#kbd-close{background:#3a3a3c;color:#fff;border:1px solid #000;border-radius:8px;min-width:44px;min-height:44px;font-size:16px}
/* Lower-right floating toggle (Kasm pattern): coarse pointers only,
real 56px target, always above the panel. */
#kb-fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;z-index:60;background:#0a84ff;color:#fff;border:1px solid #000;font-size:17px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.5)}
@media (pointer:coarse){#kb-fab{display:block}}
/* On-screen keyboard in the viewer dark theme: the stock
simple-keyboard palette is pale gray on white and unreadable here.
Keys meet the 48px Material touch height at phone width. */
#kbd.hg-theme-default{background:#1c1c1e}
#kbd.hg-theme-default .hg-button{background:#3a3a3c;color:#fff;border-color:#000;box-shadow:0 0 3px -1px rgba(0,0,0,.9);min-height:48px;font-size:20px}
#kbd.hg-theme-default .hg-button span{color:#fff;opacity:1}
#kbd.hg-theme-default .hg-button.hg-activeButton{background:#0a84ff}
</style>
<!-- Vendored same-origin (backend serves ./vendor/): the page must
load with zero external requests — a render-blocking CDN script
stalls onLoad (and the console's cobrowse iframe state) whenever
the CDN is unreachable. MIT simple-keyboard 3.8.205, pristine
upstream bytes in simple-keyboard-3.8.205.{js,css}. -->
<link rel="stylesheet" href="vendor/simple-keyboard-3.8.205.css">
<script src="vendor/simple-keyboard-3.8.205.js"></script>
</head><body>
<div id="bar"><form id="nav"><input id="url" value="__DEFAULT_URL__" aria-label="Address" type="url" inputmode="url" enterkeyhint="go" autocapitalize="off" spellcheck="false"><button id="go" type="submit">Go</button></form><button id="kb" type="button" aria-label="Keyboard" aria-expanded="false" aria-controls="kbd">Keyboard</button><span id="state" role="status">connecting…</span></div>
<div id="stats">fps: - | last activity→frame: - ms</div>
<canvas id="screen" width="1280" height="800"></canvas>
<button id="kb-fab" type="button" aria-label="Toggle keyboard" aria-controls="kbd">ABC</button>
<div id="kbd" class="simple-keyboard" hidden><div id="kbd-handle"><span id="kbd-grip" aria-hidden="true">⠿⠿</span><span id="kbd-title">Keyboard</span><button id="kbd-close" type="button" aria-label="Close keyboard">✕</button></div></div>
<script>
const base = location.pathname.replace(/\/$/, '');
const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + base + '/ws';
// Auto-reconnect: deploys and Grid restarts drop the socket, and a
// dead socket silently eats clicks — so a close re-dials after a
// beat instead of stranding the canvas. Sends are guarded on
// readyState so input during the gap is dropped, never thrown.
const cv = document.getElementById('screen'), ctx = cv.getContext('2d');
cv.tabIndex = 0;
const img = new Image(); let frames = 0, t0 = performance.now(), lastClick = 0;
let dsf = 1;
let ws = null;
let reconnectTimer = 0;
let noFrameTimer = 0;
function sendable() { return ws && ws.readyState === 1; }
function setControlsEnabled(on) {
  for (const id of ['url', 'go', 'kb', 'kb-fab']) {
    document.getElementById(id).disabled = !on;
  }
}
function connect() {
  clearTimeout(reconnectTimer);
  try {
    ws = new WebSocket(wsUrl);
  } catch (_) {
    // Synchronous constructor throw (no path re-dials otherwise):
    // show the gap and retry like a clean close.
    document.getElementById('state').textContent = 'reconnecting — input paused…';
    setControlsEnabled(false);
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }
  ws.onopen = () => {
    document.getElementById('state').textContent = 'live';
    setControlsEnabled(true);
    cv.style.opacity = '';
    frames = 0; t0 = performance.now();
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'dsf') { dsf = m.dsf || 1; return; }
    if (m.type === 'attached') {
      dsf = m.dsf || 1;
      const label = m.kind === 'agent' ? 'shared agent session'
        : m.kind === 'viewer-shared' ? 'shared browser tab' : 'own session';
      const st = document.getElementById('state');
      st.dataset.label = label + ' · live';
      st.textContent = st.dataset.label;
      st.title = 'session ' + m.session;
      // A live socket with no frames means the Grid side is not
      // producing (single slot held elsewhere, or a stuck session):
      // say so instead of a black canvas that reads as broken.
      clearTimeout(noFrameTimer);
      noFrameTimer = setTimeout(() => {
        if (frames === 0) st.textContent = st.dataset.label + ' (no frames yet — slot may be busy)';
      }, 12000);
      return;
    }
    if (m.type === 'status' || m.type === 'reattached') {
      document.getElementById('state').textContent = m.msg || m.type;
      return;
    }
    if (m.type === 'error') {
      document.getElementById('state').textContent = 'error: ' + (m.msg || 'browser op failed');
      return;
    }
    if (m.type === 'frame') {
      img.onload = () => {
        // First frame clears a stale slot-busy hint, if shown.
        if (frames === 0) {
          clearTimeout(noFrameTimer);
          const st = document.getElementById('state');
          if (st.dataset.label) st.textContent = st.dataset.label;
        }
        if (cv.width !== img.width) { cv.width = img.width; cv.height = img.height; }
        ctx.drawImage(img, 0, 0); frames++;
        const el = (performance.now() - t0) / 1000;
        // Throttle the readout to 1 Hz: per-frame DOM writes flicker
        // and cost layout on every screencast frame.
        if (el >= 2 && (!img._lastStats || performance.now() - img._lastStats > 1000)) {
          img._lastStats = performance.now();
          document.querySelector('#stats').textContent =
            'fps: ' + (frames / el).toFixed(1) +
            ' | last activity→frame: ' + (lastClick ? (performance.now() - lastClick).toFixed(0) + ' ms' : '-');
        }
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(new Blob(
        [Uint8Array.from(atob(m.data), c => c.charCodeAt(0))], {type: 'image/jpeg'}));
    }
  };
  ws.onclose = () => {
    // Dim the canvas: a frozen last frame must not pose as live
    // while the socket is down. Controls lock too so taps during
    // the gap are visibly paused, not silently dropped.
    cv.style.opacity = '0.35';
    document.getElementById('state').textContent = 'reconnecting — input paused…';
    setControlsEnabled(false);
    clearTimeout(reconnectTimer);
    clearTimeout(noFrameTimer);
    reconnectTimer = setTimeout(connect, 2000);
  };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}
connect();
function pos(e) {
  const r = cv.getBoundingClientRect();
  // Canvas backing store is device pixels; CDP input is CSS pixels.
  return {x: Math.round((e.clientX - r.left) * cv.width / r.width / dsf),
          y: Math.round((e.clientY - r.top) * cv.height / r.height / dsf)};
}
// Hover/cursor feedback: stream pointer moves (rAF-throttled) as
// CDP mouseMoved so the remote page hovers, links highlight, and
// the screencast repaints under the cursor like a local tab. Moves never
// pause the agent — only click/key/go do.
let movePending = false, moveQueued = null;
cv.addEventListener('mousemove', (e) => {
  if (!sendable()) return;
  moveQueued = pos(e);
  if (movePending) return;
  movePending = true;
  requestAnimationFrame(() => {
    movePending = false;
    if (moveQueued && sendable()) { lastClick = performance.now(); ws.send(JSON.stringify({t: 'move', ...moveQueued})); }
  });
});
cv.addEventListener('click', (e) => { if (!sendable()) return; cv.focus(); lastClick = performance.now(); ws.send(JSON.stringify({t: 'click', ...pos(e)})); });
// Wheel scrolls the remote page instead of the viewer chrome.
cv.addEventListener('wheel', (e) => {
  if (!sendable()) return;
  e.preventDefault();
  const f = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
  lastClick = performance.now();
  ws.send(JSON.stringify({t: 'wheel', ...pos(e), dx: Math.round(e.deltaX * f), dy: Math.round(e.deltaY * f)}));
}, {passive: false});
// One-finger drag scrolls the remote page (touch-action:none in CSS
// keeps the viewer chrome itself from panning/zooming instead).
let touchId = null;
cv.addEventListener('touchstart', (e) => {
  if (!sendable() || touchId !== null) return;
  const t = e.changedTouches[0];
  e.preventDefault();
  const p = pos(t);
  lastClick = performance.now();
  // Drop-start symmetry: only record the touch when its start was
  // actually sent, so a later end can never stick the remote touch.
  try { ws.send(JSON.stringify({t: 'touch', phase: 'start', ...p})); }
  catch (_) { return; }
  touchId = t.identifier;
}, {passive: false});
// Move traffic is rAF-coalesced like mousemove: only the latest
// position per frame crosses the socket, so drags cannot
// head-of-line-block clicks behind a wall of move frames.
let touchMovePending = false, touchMoveQueued = null;
cv.addEventListener('touchmove', (e) => {
  if (!sendable() || touchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== touchId) continue;
    e.preventDefault();
    touchMoveQueued = pos(t);
  }
  if (touchMovePending || !touchMoveQueued) return;
  touchMovePending = true;
  requestAnimationFrame(() => {
    touchMovePending = false;
    if (touchMoveQueued && sendable() && touchId !== null) {
      lastClick = performance.now();
      try { ws.send(JSON.stringify({t: 'touch', phase: 'move', ...touchMoveQueued})); }
      catch (_) {}
    }
    touchMoveQueued = null;
  });
}, {passive: false});
function touchEnd(e) {
  if (touchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== touchId) continue;
    touchId = null;
    lastClick = performance.now();
    // Best-effort end: the start went out, so always attempt the
    // matching end (a dead socket throws, caught, nothing sticks
    // locally either way).
    try { if (sendable()) ws.send(JSON.stringify({t: 'touch', phase: 'end', ...pos(t)})); }
    catch (_) {}
  }
}
cv.addEventListener('touchend', touchEnd);
cv.addEventListener('touchcancel', touchEnd);
function sendKey(key, code) {
  if (!sendable()) return;
  // Mobile IMEs report Unidentified/229 composition placeholders on
  // keydown with no usable data — the text itself arrives through the
  // on-screen keyboard below, so drop these instead of erroring.
  if (key === 'Unidentified' || key === 'Process') return;
  lastClick = performance.now();
  ws.send(JSON.stringify({t: 'key', key, code}));
}
function typeText(text) {
  if (!sendable() || !text) return;
  lastClick = performance.now();
  ws.send(JSON.stringify({t: 'type', text}));
}
// Document-level so physical keyboards keep working after the focus
// moves to the URL box or the Keyboard toggle; the URL box itself is
// excluded so typing an address never drives the remote page. Tab
// and Escape always propagate (focus trap otherwise).
document.addEventListener('keydown', (e) => {
  if (e.target && e.target.id === 'url') return;
  if (e.key === 'Tab' || e.key === 'Escape') return;
  // Browser and OS shortcuts must always reach the viewer tab: a
  // wedged remote page must never cost the user reload (Ctrl+R,
  // F5), clipboard, or function keys. Plain keys only from here.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^F\d+$/.test(e.key)) return;
  // Enter/Space on a focused control activates the control; do
  // not ALSO drive the remote page (double action).
  if ((e.key === 'Enter' || e.key === ' ') && e.target &&
      (e.target.tagName === 'BUTTON' || e.target.type === 'submit')) return;
  if (!sendable()) return;
  e.preventDefault();
  sendKey(e.key, e.code || e.key);
});
// Off-the-shelf on-screen keyboard (simple-keyboard, MIT): the remote
// page gets real CDP input, so tapping the Keyboard button works on a
// phone with no native keyboard involved. Special keys reuse the key
// path; printable keys commit via one Input.insertText call per tap.
(function initKbd() {
  const box = document.getElementById('kbd');
  const btn = document.getElementById('kb');
  // Mount rides the .simple-keyboard class hook on #kbd (verified in
  // the pinned bundle: the constructor takes no rootElement, it
  // finds the mount node by that class). Gate on window.SimpleKeyboard
  // only: Chrome's DOM Keyboard interface is a non-constructible
  // function, so the old bare-global fallback bricked nav wiring
  // when the CDN failed. Construction stays guarded for the same
  // reason — a dead keyboard must never kill URL navigation.
  const lib = window.SimpleKeyboard;
  const Kbd = lib && (lib.default || lib.SimpleKeyboard);
  let kbd = null;
  if (typeof Kbd === 'function') {
    try {
      kbd = new Kbd({theme: "hg-theme-default",
        // Phone taps must not wait out the 300ms mouse delay or
        // double-fire: use touch events, fall back automatically.
        useTouchEvents: true,
        autoUseTouchEvents: true,
        onKeyPress: onPress});
    } catch (_) { kbd = null; }
  }
  const fab = document.getElementById('kb-fab');
  if (!kbd || typeof kbd.setOptions !== 'function') {
    btn.hidden = true;
    fab.hidden = true;
    return;
  }
  function onPress(button) {
      if (button === '{enter}') { sendKey('Enter', 'Enter'); return; }
      if (button === '{bksp}') { sendKey('Backspace', 'Backspace'); return; }
      if (button === '{tab}') { sendKey('Tab', 'Tab'); return; }
      if (button === '{shift}' || button === '{lock}') {
        const cur = kbd.options.layoutName || 'default';
        kbd.setOptions({layoutName: cur === 'default' ? 'shift' : 'default'});
        return;
      }
      if (button === '{space}') { typeText(' '); return; }
      if (/^\{.+\}$/.test(button)) return;
      typeText(button);
  }
  function setOpen(open) {
    box.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    // Fixed overlay: no scrollIntoView, the canvas never reflows.
  }
  btn.addEventListener('click', () => setOpen(box.hidden));
  fab.addEventListener('click', () => setOpen(box.hidden));
  document.getElementById('kbd-close').addEventListener('click', () => setOpen(false));
  // Draggable by the handle only (never by keys): pointer events
  // with touch-action:none on the handle, clamped to the visual
  // viewport, position remembered across sessions.
  const handle = document.getElementById('kbd-handle');
  try {
    const saved = JSON.parse(localStorage.getItem('kbd-pos') || 'null');
    if (saved && typeof saved.left === 'number' && typeof saved.top === 'number') {
      box.style.left = saved.left + 'px';
      box.style.right = 'auto';
      box.style.bottom = 'auto';
      box.style.top = saved.top + 'px';
    }
  } catch (_) {}
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    const r = box.getBoundingClientRect();
    const ox = sx - r.left, oy = sy - r.top;
    // Pin to explicit coords so the panel follows the finger.
    box.style.left = r.left + 'px';
    box.style.right = 'auto';
    box.style.bottom = 'auto';
    box.style.top = r.top + 'px';
    const move = (ev) => {
      const vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
      const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      let x = Math.min(Math.max(0, ev.clientX - ox), vw - 48);
      let y = Math.min(Math.max(0, ev.clientY - oy), vh - 48);
      box.style.left = x + 'px';
      box.style.top = y + 'px';
    };
    const up = (ev) => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      try {
        localStorage.setItem('kbd-pos', JSON.stringify({
          left: parseFloat(box.style.left) || 0,
          top: parseFloat(box.style.top) || 0}));
      } catch (_) {}
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
})();
function normalizeUrl(raw) {
  // Chrome-omnibox-lite: trim first; keep explicit schemes and
  // chrome pages; bare hostnames ride https://; bare host:port
  // rides http:// (alt ports are near-always plain-http local
  // services); spaced input is left for the engine to reject
  // visibly rather than mangled here.
  const v = (raw || '').trim();
  if (!v || /\s/.test(v)) return v;
  if (/^https?:\/\//i.test(v)) return v;
  if (/^(about|data|blob):/i.test(v)) return v;
  if (/^[^/:?\s]+:\d+(\/|$|\?)/.test(v)) return 'http://' + v;
  return 'https://' + v;
}
function go() {
  if (!sendable()) return;
  const box = document.getElementById('url');
  const url = normalizeUrl(box.value);
  if (!url) return;
  box.value = url;
  ws.send(JSON.stringify({t: 'go', url}));
}
// Form submit (not button click) so Enter in the address box and
// the Go button take the same path — keyboard and touch alike.
document.getElementById('nav').onsubmit = (e) => { e.preventDefault(); go(); };
</script></body></html>
