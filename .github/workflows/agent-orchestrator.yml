# Action pins (issue #529): third-party actions are SHA-pinned (immutable refs).
# Bumps arrive as reviewed PRs via Dependabot (github-actions ecosystem, weekly;
# see .github/dependabot.yml) — verify the boomtick diff before merging.
name: Agent Orchestrator

on:
  workflow_dispatch:
    inputs:
      task_type:
        description: 'Task Type (e.g. audit, repair, dependabot)'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - repair
          - dependabot
      audit_type:
        description: 'Audit Type (e.g. codebase-integrity-audit, review-pr)'
        required: false
        default: 'codebase-integrity-audit'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  agent-orchestrator:
    name: Agent Orchestration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Agent Orchestrator
        uses: arii/boomtick/.github/actions/agent-orchestrator@34d6757f39e3d6f9a0d03502489d3c41ee4688a6 # boomtick main as of 2026-11-03
        with:
          task_type: ${{ inputs.task_type }}
          audit_type: ${{ inputs.audit_type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
