# Action pins (issue #529): third-party actions are SHA-pinned (immutable refs).
# Bumps arrive as reviewed PRs via Dependabot (github-actions ecosystem, weekly;
# see .github/dependabot.yml) — verify the boomtick diff before merging.
name: CI Self-Repair Automation

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ci-repair:
    name: CI Self-Repair
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initiate Self-Repair Session
        uses: arii/boomtick/.github/actions/ci-repair@34d6757f39e3d6f9a0d03502489d3c41ee4688a6 # boomtick main as of 2026-11-03
        with:
          run_id: ${{ github.event.workflow_run.id }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
