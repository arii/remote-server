# Action pins (issue #529): third-party actions are SHA-pinned (immutable refs).
# Bumps arrive as reviewed PRs via Dependabot (github-actions ecosystem, weekly;
# see .github/dependabot.yml) — verify the boomtick diff before merging.
name: AI Code Review & Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: AI Review & Impact Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Automated AI Code Review
        uses: arii/boomtick@34d6757f39e3d6f9a0d03502489d3c41ee4688a6 # boomtick main as of 2026-11-03
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
