# Action pins (issue #529): third-party actions are SHA-pinned (immutable refs).
# Bumps arrive as reviewed PRs via Dependabot (github-actions ecosystem, weekly;
# see .github/dependabot.yml) — verify the boomtick diff before merging.
#
# Verdict gate: fail-on-verdict makes a FAIL verdict fail this check after the
# review is posted, listing blocking findings. A warn verdict stays green. The
# own-PR COMMENT fallback (reviewer cannot approve its own PR) never fails by
# itself. Hard errors fail as before.
name: AI Code Review & Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: AI Review & Impact Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The review shells out to td for impact/semantic context; install
      # the pinned revision (same immutable revision as e2e.yml and the
      # Dockerfiles). Without this the step fails with `spawn td ENOENT`
      # and the review posts with no impact analysis (#1620).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: install boomtick td CLI
        run: pip install "git+https://github.com/arii/boomtick.git@a0c62ee55460de42037ed37fb5d2289b692e3043#subdirectory=cli"

      - name: Verify review dependency
        run: command -v td

      - name: Automated AI Code Review
        uses: arii/boomtick@df2f59bd34192424c315aa99f8a45cf14989db75 # reviewed main, 2026-11-25 (#1605)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          fail-on-verdict: 'true'
