# Console E2E smoke suite (issue #854).
#
# Proves the money flows (agent turn, approve/merge gates, review
# context, job runs) against a live backend + built SPA with
# stubbed gh/docker — no models, no daemons, no side effects.
#
# Deliberately NON-REQUIRED until three consecutive green runs
# prove it stable; only then make it a required context. (No
# branch-protection change ships with this workflow.)
name: console-e2e

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: console E2E smoke (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # td shells to the Actions API (workflow runs) and Checks API
    # (annotations) for workflow-health; contents:read alone 403s
    # those calls and every run fails (issue #1090).
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7

      # packageManager is the single pnpm source; a version: here fails the setup.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: 'pnpm'

      - name: install workspace deps
        run: pnpm install --frozen-lockfile

      - name: build frontend SPA
        run: pnpm --filter frontend build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install backend deps
        run: pip install -r backend/requirements.txt

      # The backend shells out to td; install current upstream
      # (latest-only, same float as the Dockerfiles).
      - name: install boomtick td CLI
        run: pip install "git+https://github.com/arii/boomtick.git@main#subdirectory=cli"

      - name: cache e2e npm store
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-e2e-npm-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: install e2e deps
        run: npm ci
        working-directory: tests/e2e

      - name: cache playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: typecheck suite
        run: npm run typecheck
        working-directory: tests/e2e

      - name: install chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: run console E2E suite
        run: npx playwright test
        working-directory: tests/e2e
        # The backend shells td for workflow-health; td needs a token
        # (proven by CI log: "Missing GITHUB_TOKEN environment
        # variable"). Explicit beats assuming the runner exports it
        # into the playwright webServer env.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
