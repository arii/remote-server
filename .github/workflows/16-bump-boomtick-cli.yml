# Advances immutable CLI pins to newer published cli-* releases.
#
# Pins live in four places and must move together:
#   Dockerfile (ARG BOOMTICK_CLI_REF), terminal/Dockerfile (ARG),
#   .github/workflows/e2e.yml (pip install @ref), tests/e2e/run.sh (same).
# Runs weekly plus on demand; never downgrades an unreleased SHA pin.
name: bump-boomtick-cli

on:
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest cli release and bump pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/arii/boomtick/releases --paginate \
            | jq -rs '[.[][] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^cli-v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.published_at) | last | .tag_name // empty')
          if [ -z "$TAG" ]; then echo "no published cli release found"; exit 1; fi
          SHA=$(gh api "repos/arii/boomtick/commits/$TAG" --jq .sha)
          CURRENT=$(sed -n 's/^ARG BOOMTICK_CLI_REF=//p' Dockerfile)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$CURRENT" =~ ^[0-9a-f]{40}$ ]]
          STATUS=$(gh api "repos/arii/boomtick/compare/$CURRENT...$SHA" --jq .status)
          case "$STATUS" in
            identical|behind) echo "release $TAG does not advance $CURRENT; nothing to do"; exit 0 ;;
            ahead) ;;
            *) echo "release $TAG diverges from pinned commit; manual review required"; exit 1 ;;
          esac
          export SHA TAG
          python3 - <<'PY'
          import os
          import pathlib
          import re

          sha = os.environ["SHA"]
          patterns = {
              "Dockerfile": r"(?m)(^ARG BOOMTICK_CLI_REF=)[0-9a-f]{40}$",
              "terminal/Dockerfile": r"(?m)(^ARG BOOMTICK_CLI_REF=)[0-9a-f]{40}$",
              ".github/workflows/e2e.yml": r"(github\.com/arii/boomtick\.git@)[0-9a-f]{40}(?=#subdirectory=cli)",
              "tests/e2e/run.sh": r"(github\.com/arii/boomtick\.git@)[0-9a-f]{40}(?=#subdirectory=cli)",
          }
          updates = {}
          for name, pattern in patterns.items():
              path = pathlib.Path(name)
              updated, count = re.subn(pattern, lambda m: m[1] + sha, path.read_text())
              if count != 1:
                  raise SystemExit(f"expected one immutable pin in {name}, found {count}")
              updated = re.sub(
                  r"# v[0-9]+\.[0-9]+\.[0-9]+[^\n]*",
                  "# " + os.environ["TAG"].removeprefix("cli-"),
                  updated,
              )
              updates[path] = updated
          for path, updated in updates.items():
              path.write_text(updated)
          PY
          if git diff --quiet; then
            echo "pins already at latest ($TAG); nothing to do"
            exit 0
          fi
          BRANCH="cli-ref-bump-$TAG"
          git config user.name "arii"
          git config user.email "arii"
          git checkout -B "$BRANCH"
          git add Dockerfile terminal/Dockerfile .github/workflows/e2e.yml tests/e2e/run.sh
          git commit -m "chore(deps): bump boomtick CLI ref to $TAG"
          git push -u origin "$BRANCH" --force-with-lease
          if gh pr list --head "$BRANCH" --json number --jq -e '.[0].number' >/dev/null; then
            echo "PR already open for $BRANCH"
          else
            gh pr create --title "chore(deps): bump boomtick CLI ref to $TAG" \
              --body "Weekly cli-ref bump: all pins move to $TAG (latest cli-* release). No behavior change beyond the newer CLI." \
              --head "$BRANCH" --base main
          fi

