name: CI

# Builds the terminal image on every push/PR, validates the compose file,
# lints the shell scripts, verifies the skills lock against upstream,
# scans for leaked secrets, and runs the
# backend + root + frontend test suites with the backend type-check.
#
# Docker workflow replicates arii/BoomTick's pattern:
# .github/actions/setup-docker-buildx (ghcr.io login + buildx),
# docker/metadata-action tags, build-push-action with GHA layer cache.
#
# CI needs ZERO secrets: image pushes use the automatic GITHUB_TOKEN.
# Runtime secrets live only in .env on the box (git-ignored) — never here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write # push terminal image to GHCR on main

env:
  TERMINAL_IMAGE: ghcr.io/arii/remote-server-terminal

jobs:
  shell:
    name: lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash syntax check
        run: bash -n scripts/*.sh
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

  compose:
    name: validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: dummy env from example (deleted afterwards)
        run: cp .env.example .env.ci
      - name: docker compose config
        run: docker compose --env-file .env.ci config --quiet
      - name: cleanup
        run: rm -f .env.ci
        if: always()

  terminal-image:
    name: build (+push) terminal image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx and Registry Login
        uses: ./.github/actions/setup-docker-buildx

      - name: "read version pins (single source of truth — .env.example)"
        id: pins
        run: |
          echo "ttyd=$(grep -E '^TTYD_VERSION=' .env.example | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "zellij=$(grep -E '^ZELLIJ_VERSION=' .env.example | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.TERMINAL_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./terminal
          build-args: |
            TTYD_VERSION=${{ steps.pins.outputs.ttyd }}
            ZELLIJ_VERSION=${{ steps.pins.outputs.zellij }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  skills-lock:
    name: verify skills lock vs upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check lock matches upstream skill sources
        run: bash scripts/verify-skills.sh --check-upstream

  secret-scan:
    name: scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  audit:
    name: fallow code audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: run fallow audit
        run: pnpm run audit:fallow

  frontend:
    name: frontend tsc + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm --filter frontend lint
      - name: unit tests
        run: pnpm --filter frontend test

  backend:
    name: backend tests + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install backend deps
        run: pip install -r backend/requirements.txt
      - name: install root-suite deps
        run: pip install "pytest==9.1.1"
      - name: type-check backend tree
        run: npm run type-check
      - name: backend unit tests
        run: npm run test:backend
      - name: root unit tests
        run: npm run test:root
      - name: validate configs
        run: python3 -m core_cli validate-config
