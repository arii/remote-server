name: CI

# Builds the terminal image on every push/PR, validates the compose file,
# lints the shell scripts, verifies the skills lock against upstream,
# rejects shadow skill copies, scans for leaked secrets, and runs the
# backend + root + frontend test suites with the backend compile + ruff gates.
#
# Docker workflow replicates arii/BoomTick's pattern:
# .github/actions/setup-docker-buildx (ghcr.io login + buildx),
# docker/metadata-action tags, build-push-action with GHA layer cache.
#
# CI needs ZERO secrets: image pushes use the automatic GITHUB_TOKEN.
# Runtime secrets live only in .env on the box (git-ignored) — never here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write # push terminal image to GHCR on main

env:
  TERMINAL_IMAGE: ghcr.io/arii/remote-server-terminal

jobs:
  shell:
    name: lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash syntax check
        run: bash -n scripts/*.sh
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

  compose:
    name: validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: dummy env from example (deleted afterwards)
        run: cp .env.example .env.ci
      - name: docker compose config
        run: docker compose --env-file .env.ci config --quiet
      - name: cleanup
        run: rm -f .env.ci
        if: always()

  terminal-image:
    name: build (+push) terminal image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx and Registry Login
        uses: ./.github/actions/setup-docker-buildx

      - name: "read version pins (single source of truth — .env.example)"
        id: pins
        run: |
          echo "ttyd=$(grep -E '^TTYD_VERSION=' .env.example | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "zellij=$(grep -E '^ZELLIJ_VERSION=' .env.example | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.TERMINAL_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./terminal
          build-args: |
            TTYD_VERSION=${{ steps.pins.outputs.ttyd }}
            ZELLIJ_VERSION=${{ steps.pins.outputs.zellij }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  skills-lock:
    name: verify skills lock vs upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check lock matches upstream skill sources
        run: bash scripts/verify-skills.sh --check-upstream

  skill-shadows:
    name: no shadow skill copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: fail on real files under .claude/skills
        run: bash scripts/check-no-shadow-skills.sh

  secret-scan:
    name: scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  audit:
    name: fallow code audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # packageManager is the single pnpm source; a version: here fails the setup.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: run fallow audit
        run: pnpm run audit:fallow

  frontend:
    name: frontend tsc + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # packageManager is the single pnpm source; a version: here fails the setup.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm --filter frontend lint
      - name: unit tests
        run: pnpm --filter frontend test

  backend:
    # Display name pinned by branch protection (required context
    # "backend tests + type-check"): the steps inside are honestly
    # named. Do not rename without updating protection first.
    name: backend tests + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: install backend deps
        run: pip install -r backend/requirements.txt
      - name: install root-suite deps
        run: pip install "pytest==9.1.1" "ruff==0.17.4"
      - name: compile-check backend tree
        run: npm run compile-check
      - name: lint Python (ruff pyflakes-class)
        run: npm run lint:python
      - name: backend unit tests
        run: npm run test:backend
      - name: root unit tests
        run: npm run test:root
      - name: validate configs
        run: python3 -m backend.validate_config

  format:
    name: ruff format (diff-aware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: install ruff
        run: pip install "ruff==0.17.4"
      - name: diff-aware format check
        run: bash scripts/check-format-diff.sh

  report:
    name: comment CI failures on the PR
    # A failing PR yields a PR comment, never a new issue per failure
    # (issue #1081). One marker comment per PR, updated per run.
    needs: [shell, compose, terminal-image, skills-lock, skill-shadows, secret-scan, audit, frontend, backend, format]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: comment failures
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ci-failure-report -->';
            const results = ${{ toJSON(needs) }};
            const failed = Object.entries(results)
              .filter(([, r]) => r && r.result === 'failure')
              .map(([name]) => name);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments(
              { owner, repo, issue_number });
            const prior = comments.find(
              (c) => c.body && c.body.includes(marker));
            if (failed.length === 0) {
              if (prior) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: prior.id,
                  body: `${marker}\nCI is green — earlier failures cleared.`,
                });
              }
              return;
            }
            const jobs = failed.map((n) => `\`${n}\``).join(', ');
            const body = `${marker}\nCI failures in this run: ${jobs}. ` +
              'Fix the jobs — do not file a follow-up issue per failure (#1081).';
            if (prior) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }
