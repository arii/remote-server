# Action pins (issue #529): third-party actions are SHA-pinned (immutable refs).
# Bumps arrive as reviewed PRs via Dependabot (github-actions ecosystem, weekly;
# see .github/dependabot.yml) — verify the boomtick diff before merging.
name: ChatOps Trigger

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  chatops:
    name: ChatOps Dispatch
    # Authorization boundary: only trusted authors dispatch. Untrusted
    # PR comments no-op here, before any secret-bearing step runs.
    if: ${{ github.event.issue.pull_request && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dispatch ChatOps Command
        uses: arii/boomtick@34d6757f39e3d6f9a0d03502489d3c41ee4688a6 # boomtick main as of 2026-11-03
        with:
          pr_number: "${{ github.event.issue.number }}"
          comment_body: ${{ github.event.comment.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
