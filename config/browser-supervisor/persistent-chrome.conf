; Persistent personal browser on the shared X display (:99).
; Grid sessions come and go (each QUIT kills its Chrome window), which
; reads as "the browser keeps crashing" in the noVNC stream. This
; window is always there: same display, separate profile, so it never
; contends with agent sessions (single Grid slot).
; Loaded via the browser service's conf.d file mount.

[program:persistent-chrome]
priority=12
command=/usr/bin/chromium --disable-dev-shm-usage --user-data-dir=/data/shared-browser/personal --no-first-run --no-default-browser-check --password-store=basic --disable-features=Translate --window-size=1920,1080 --start-maximized --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0
environment=DISPLAY=":99",HOME="/home/seluser"
autostart=true
autorestart=true
startsecs=10
startretries=10

;Logs
redirect_stderr=false
stdout_logfile=/var/log/supervisor/persistent-chrome-stdout.log
stderr_logfile=/var/log/supervisor/persistent-chrome-stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
stdout_capture_maxbytes=50MB
stderr_capture_maxbytes=50MB
