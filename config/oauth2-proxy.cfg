# oauth2-proxy static config. Secrets come from environment
# (OAUTH2_PROXY_CLIENT_ID / _CLIENT_SECRET / _COOKIE_SECRET /
#  _GITHUB_USER / _REDIRECT_URL) — never put them here.
# CLI flags in docker-compose.yml override/extend this file.

provider = "github"
scope = "read:user user:email"

# single-user gate; value injected via OAUTH2_PROXY_GITHUB_USER
# github_user is set from the environment, see docker-compose.yml

email_domains = ["*"]

cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "12h"
cookie_refresh = "1h"

# This proxy IS the TLS edge (it terminates TLS with the Let's Encrypt certs
# itself, see --tls-cert-file/--tls-key-file in docker-compose.yml), so it
# must NOT trust X-Forwarded-* headers from clients.
reverse_proxy = true
skip_provider_button = true
pass_user_headers = true
set_xauthrequest = true

# Upstream is ttyd (plain HTTP) on the compose network; see --upstream in
# docker-compose.yml. WebSocket upgrades proxy through by default.
