<!doctype html>
<html><head><title>Multi-step application (synthetic)</title></head><body>
<form>
  <div data-step="1">
    <label for="s1_name">Full name</label><input id="s1_name" name="s1_name" type="text">
    <label for="s1_email">Email Address</label><input id="s1_email" name="s1_email" type="text">
  </div>
  <div data-step="2">
    <label for="s2_phone">Phone Number</label><input id="s2_phone" name="s2_phone" type="text">
    <label for="s2_company">Current company</label><input id="s2_company" name="s2_company" type="text">
  </div>
  <div data-step="3">
    <label for="s3_linkedin">LinkedIn</label><input id="s3_linkedin" name="s3_linkedin" type="text">
    <label for="s3_why">Why do you want to work here?</label><input id="s3_why" name="s3_why" type="text">
  </div>
</form>
</body></html>
