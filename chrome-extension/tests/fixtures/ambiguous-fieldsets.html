<!doctype html>
<html><head><title>Checkout (synthetic)</title></head><body>
<form>
  <fieldset id="billing">
    <legend>Billing address</legend>
    <label for="bill_street">Street address</label><input id="bill_street" name="bill_street" type="text">
    <label for="bill_city">City</label><input id="bill_city" name="bill_city" type="text">
    <label for="bill_zip">ZIP code</label><input id="bill_zip" name="bill_zip" type="text">
  </fieldset>
  <fieldset id="shipping">
    <legend>Shipping address</legend>
    <label for="ship_street">Street address</label><input id="ship_street" name="ship_street" type="text">
    <label for="ship_city">City</label><input id="ship_city" name="ship_city" type="text">
    <label for="ship_zip">ZIP code</label><input id="ship_zip" name="ship_zip" type="text">
  </fieldset>
  <fieldset>
    <legend>Delivery contact</legend>
    <input id="ship_postal" name="ship_postal" type="text" aria-label="Shipping postal code">
    <input id="bill_postal" name="bill_postal" type="text" aria-label="Billing postal code">
  </fieldset>
</form>
</body></html>
