<style>
#takeover-bar {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 99999;
}
.takeover-btn {
  background: #2563eb;
  color: #ffffff;
  border: 1px solid #1d4ed8;
  padding: 6px 14px;
  border-radius: 6px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  transition: background 0.15s ease;
}
.takeover-btn:hover { background: #1d4ed8; }
.takeover-btn:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
<div id="takeover-bar">
  <button id="takeover-btn" class="takeover-btn" type="button" onclick="window.__switchTerminal()">Switch to this terminal</button>
</div>
<script>
window.__switchTerminal = async function() {
  const btn = document.getElementById('takeover-btn');
  const fail = (msg) => {
    if (btn) { btn.disabled = false; btn.textContent = msg; }
  };
  if (btn) { btn.disabled = true; btn.textContent = 'Switching...'; }
  try {
    const res = await fetch('/buttons/api/terminal/takeover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ intent: 'terminal-takeover', confirmed: true }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      fail('Takeover failed (' + res.status + ') — tap to retry');
      return;
    }
    if (btn && data.output && data.output.indexOf('hup_exit=1') !== -1) {
      btn.textContent = 'No other session — reloading...';
    }
  } catch (e) {
    fail('Takeover request failed — tap to retry');
    return;
  }
  setTimeout(() => {
    location.reload();
  }, 600);
};

// Monitor for connection failure or disconnection overlays
setInterval(() => {
  const overlays = document.querySelectorAll('.xterm-overlay');
  const btn = document.getElementById('takeover-btn');
  if (!btn) return;
  let hasClosed = false;
  overlays.forEach(el => {
    if (el.textContent && (el.textContent.includes('Connection Closed') || el.textContent.includes('Press ⏎') || el.textContent.includes('Reconnecting'))) {
      hasClosed = true;
    }
  });
  if (hasClosed) {
    btn.style.background = '#ef4444';
    btn.style.borderColor = '#dc2626';
  }
}, 1000);
</script>
